[project]
name = "deep-learning"
version = "0.1.0"
requires-python = ">= 3.12.4"
dependencies = [
    "coverage>=7.17.0",
    "datasets>=5.1.0",
    "faster-coco-eval>=1.8.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "torch>=2.14.1",
    "torchmetrics>=1.9.0",
    "torchvision>=0.29.1",
    "tqdm>=4.70.1",
    "transformers>=5.20.2",
]

[tool.ruff]
extend-exclude = [
    "*.venv*",
    "*DATA*",
    "*Week_00*",
]

[tool.pyrefly]
project-excludes = [
    "**/*venv*",
    "**/*DATA*",
    "*Week_00*",
]
