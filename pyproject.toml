[project]
name = "deep-learning"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "torch>=2.15.0",
]

[project.scripts]
task = "weeks.task_executor:cli"

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "weeks"
module-root = ""

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
